# ======================== Windows UDP/JSON 桥接节点 ========================
serve_bridge_node:
  ros__parameters:
    # UDP 监听地址。0.0.0.0 表示监听 RK3588 的所有网络接口。
    host: 0.0.0.0

    # Windows 上位机连接的 UDP 端口。
    port: 8765

    # Bridge 订阅的实时定位，用于向 Windows 返回机器位置和定位就绪状态。
    robot_state_topic: /localization/robot_state

    # Bridge 订阅的机构反馈，用于向 Windows 返回轮速、俯仰和在线状态。
    launcher_state_topic: /tennis/launcher/state

    # 飞轮底层反馈，包含 F407 实际 ARM/DISARM 状态，用于状态接口显示。
    launcher_wheel_state_topic: /launcher/wheels/state

    # Bridge 订阅的训练任务状态，用于生成 UDP 状态响应。
    serve_status_topic: /tennis/serve_status

    # 软件急停为锁存信号；一旦收到 true，状态接口不再报告允许执行。
    emergency_stop_topic: /tennis/emergency_stop

    # Windows 状态接口判定定位是否就绪的数据年龄上限，单位：秒。
    localization_timeout_s: 1.0

    # Windows 状态接口判定机构是否在线的数据年龄上限，单位：秒。
    launcher_state_timeout_s: 1.0

    # Job Manager 状态超过该年龄后，Bridge 将其视为不可用。
    serve_status_timeout_s: 1.0
